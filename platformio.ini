; PlatformIO Project Configuration File

[platformio]
default_envs = m5stick-s3

[common]
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:m5stick-s3]
platform = espressif32 @ 6.6.0
; PlatformIO 6.6.0 does not ship an M5StickS3 board definition; Hal.cpp pins
; M5Unified/M5GFX to m5::board_t::board_M5StickS3 at runtime.
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<platform/desktop/>
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_stickmon_8mb.csv
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DSTICKMON_ENABLE_DEBUG_FEATURES=0
    -DSTICKMON_ENABLE_TRACE_LOGS=0
    -DSTICKMON_ENABLE_RENDER_STATS=0
lib_deps =
    m5stack/M5Unified@0.2.17
    m5stack/M5GFX@0.2.24
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200

[env:m5stick-s3-debug]
extends = env:m5stick-s3
build_flags =
    ${common.build_flags}
    -DSTICKMON_ENABLE_DEBUG_FEATURES=1
    -DSTICKMON_ENABLE_TRACE_LOGS=1
    -DSTICKMON_ENABLE_RENDER_STATS=1
