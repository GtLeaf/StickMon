<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickMon Simulator</title>
<style>
:root {
  --bg: #101014;
  --panel: #1a1a22;
  --border: #2a2a35;
  --text: #e8e6e3;
  --dim: #8a8794;
  --accent: #ffd23f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 20px;
}
.device-frame {
  position: relative;
  width: 100%; max-width: 640px;
}
/* 面板实拍图：334x166，圆角 ~20px（6%/12%），裁掉图片四角白边 */
.device-body {
  position: relative;
  width: 100%;
  aspect-ratio: 334 / 166;
  background: url('device-body.webp') no-repeat center / 100% 100%;
  border-radius: 6% / 12%;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transition: transform 0.12s ease-out;
  will-change: transform;
}
.device-body.shaking { transition: none; }
/* 屏幕窗口（图片镂空区）：实测相对面板 left 8.98% top 18.07% w 52.40% h 63.25% */
.screen-window {
  position: absolute;
  left: 8.98%; top: 18.07%;
  width: 52.40%; height: 63.25%;
  background: #000;
  display: flex; align-items: center; justify-content: center;
}
canvas#stickmon-canvas {
  display: block;
  width: 100%; height: auto;
  aspect-ratio: 240 / 135;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
}
.shake-control {
  position: absolute; left: 68.5%; top: 50%;
  transform: translate(-50%, -50%);
  width: 74px; height: 32px; border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px; padding: 0; z-index: 5;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  background: rgba(0,0,0,0.68); color: rgba(255,255,255,0.9);
  font-family: inherit; font-size: 11px; font-weight: 700; line-height: 1;
  cursor: grab; user-select: none; touch-action: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.shake-control:hover { background: rgba(0,0,0,0.82); }
.shake-control:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shake-control.active { cursor: grabbing; background: rgba(0,0,0,0.9); }
.shake-control .shake-icon { font-size: 15px; line-height: 1; }
/* 右侧按钮区：面板右侧空白面（窗口右缘 208px 到机身右缘 334px 的中线 ≈ 81%） */
.buttons-col {
  position: absolute;
  left: 81%; top: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  gap: 18px;
}
.sim-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.14);
  font-size: 16px; font-weight: 700; font-family: inherit;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.05s, box-shadow 0.05s;
  color: #d8d5d0; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  background: linear-gradient(145deg, #3a3a3a, #262626);
  box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
}
.sim-btn:active {
  transform: scale(0.92);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
.btn-a { color: var(--accent); }
.controls-hint {
  text-align: center; margin-top: 16px;
  font-size: 11px; color: var(--dim);
}
.controls-hint kbd {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 3px; padding: 2px 6px; font-size: 10px;
}
.loading-overlay {
  position: absolute; inset: 0;
  background: rgba(16,16,20,0.92);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: 6% / 12%; z-index: 10;
  transition: opacity 0.5s;
}
.loading-overlay.done { opacity: 0; pointer-events: none; }
.loading-text {
  font-size: 14px; color: var(--accent); letter-spacing: 2px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
@media (max-width: 560px) {
  .sim-btn { width: 40px; height: 40px; font-size: 13px; }
  .buttons-col { gap: 12px; }
  .shake-control { width: 36px; height: 27px; gap: 0; }
  .shake-control .shake-icon { font-size: 14px; }
  .shake-control span:last-child { display: none; }
  /* 窄屏下气泡改向右对齐「?」，避免溢出视口右缘 */
  .help-panel { left: auto; right: -6px; transform: none; }
}
@media (max-width: 380px) {
  .sim-btn { width: 34px; height: 34px; font-size: 11px; }
  .buttons-col { gap: 9px; }
}
</style>
</head>
<body>

<div class="device-frame">
  <div class="device-body">
    <div class="loading-overlay" id="loading">
      <div class="loading-text">LOADING...</div>
    </div>
    <div class="screen-window">
      <canvas id="stickmon-canvas" width="240" height="135"></canvas>
    </div>
    <button type="button" class="shake-control" id="shake-control"
            title="按住拖拽，模拟设备摇晃" aria-label="按住拖拽，模拟设备摇晃">
      <span class="shake-icon" aria-hidden="true">↔</span><span>摇晃</span>
    </button>
    <div class="buttons-col">
      <button class="sim-btn btn-a" id="btn-a" title="A - 确认/互动">A</button>
      <button class="sim-btn btn-b" id="btn-b" title="B - 取消/返回">B</button>
    </div>
  </div>
  <div class="controls-hint">
    <kbd>Z</kbd> / <kbd>Enter</kbd> = A &nbsp;
    <kbd>X</kbd> / <kbd>Esc</kbd> = B
  </div>
</div>

<script>
let runtimeReady = false;
function notifyParent(type, data = {}) {
  if (window.parent === window) return;
  try {
    window.parent.postMessage({ source: 'stickmon-simulator', type, ...data }, location.origin);
  } catch { /* 父页面已销毁时忽略 */ }
}
function notifyInput(inputType) {
  notifyParent('input', { inputType });
}
window.addEventListener('error', () => {
  if (!runtimeReady) notifyParent('load_failed');
});
window.addEventListener('unhandledrejection', () => {
  if (!runtimeReady) notifyParent('load_failed');
});

// ── Button / keyboard input ──────────────────────────────────────────
function bindButton(el, btnIdx) {
  const down = (e) => {
    e.preventDefault();
    if (!Module || typeof Module._stickmon_button_down !== 'function') return;
    notifyInput('button');
    Module._stickmon_button_down(btnIdx);
  };
  const up   = (e) => { e.preventDefault(); Module._stickmon_button_up(btnIdx); };
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
}

function bindShakeControl(el) {
  const body = document.querySelector('.device-body');
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let lastX = 0;
  let lastY = 0;
  let restTimer = 0;
  const clamp = (value, limit) => Math.max(-limit, Math.min(limit, value));
  const setAcceleration = (x, y, z = 1) => Module._stickmon_set_acceleration(x, y, z);
  const rest = () => {
    clearTimeout(restTimer);
    restTimer = 0;
    setAcceleration(0, 0, 1);
  };

  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    notifyInput('shake');
    pointerId = e.pointerId;
    startX = lastX = e.clientX;
    startY = lastY = e.clientY;
    el.setPointerCapture(pointerId);
    el.classList.add('active');
    body.classList.add('shaking');
  });
  el.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    const scale = 640 / body.getBoundingClientRect().width;
    setAcceleration(clamp(dx * scale / 10, 2.5), clamp(dy * scale / 10, 2.5));
    body.style.transform = `translate3d(${clamp((e.clientX - startX) * 0.18, 14)}px, ${clamp((e.clientY - startY) * 0.18, 10)}px, 0) rotate(${clamp((e.clientX - startX) * 0.06, 3)}deg)`;
    clearTimeout(restTimer);
    restTimer = setTimeout(rest, 70);
  });
  const end = (e) => {
    if (e.pointerId !== pointerId) return;
    const capturedId = pointerId;
    pointerId = null;
    if (el.hasPointerCapture(capturedId)) el.releasePointerCapture(capturedId);
    rest();
    el.classList.remove('active');
    body.classList.remove('shaking');
    body.style.transform = '';
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter') {
    if (!Module || typeof Module._stickmon_button_down !== 'function') return;
    notifyInput('keyboard');
    Module._stickmon_button_down(0);
  } else if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') {
    if (!Module || typeof Module._stickmon_button_down !== 'function') return;
    notifyInput('keyboard');
    Module._stickmon_button_down(1);
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter') {
    if (!Module || typeof Module._stickmon_button_up !== 'function') return;
    Module._stickmon_button_up(0);
  } else if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') {
    if (!Module || typeof Module._stickmon_button_up !== 'function') return;
    Module._stickmon_button_up(1);
  }
});

// ── Emscripten Module config ─────────────────────────────────────────
var Module = {
  canvas: document.getElementById('stickmon-canvas'),
  // 部署到 flasher 时由 scripts/hash-sim-assets.js 自动改写为内容哈希清单映射，请勿手改
  locateFile: function(path) { return path; },
  onRuntimeInitialized: function() {
    // 兼容直接替换 WASM、尚未由 Emscripten 胶水自动挂载的新导出。
    if (!Module._stickmon_set_acceleration && typeof wasmExports !== 'undefined') {
      Module._stickmon_set_acceleration = wasmExports.stickmon_set_acceleration;
    }
    document.getElementById('loading').classList.add('done');
    runtimeReady = true;
    notifyParent('ready', { simulatorVersion: (typeof SIM_ASSETS !== 'undefined' && SIM_ASSETS['stickmon.wasm']) || 'web' });
    bindButton(document.getElementById('btn-a'), 0);
    bindButton(document.getElementById('btn-b'), 1);
    bindShakeControl(document.getElementById('shake-control'));
    console.log('[StickMon Web] Runtime initialized');
  },
  print: function(text) { console.log('[StickMon]', text); },
  printErr: function(text) { console.warn('[StickMon]', text); },
};
</script>
<script src="stickmon.js"></script>

</body>
</html>
