<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickMon Simulator</title>
<style>
:root {
  --bg: #101014;
  --panel: #1a1a22;
  --border: #2a2a35;
  --text: #e8e6e3;
  --dim: #8a8794;
  --accent: #ffd23f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 20px;
}
.device-frame {
  background: linear-gradient(145deg, #c8321e, #a02818);
  border-radius: 18px;
  padding: 18px 22px 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
  position: relative;
  width: 100%; max-width: 640px;
}
.device-frame::before {
  content: '';
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(0,0,0,0.3);
}
.device-body {
  display: flex; align-items: center; gap: 20px;
}
.screen-bezel {
  background: #1a1a1a;
  border-radius: 6px;
  padding: 6px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
  flex: 1 1 auto; min-width: 0;
}
canvas#stickmon-canvas {
  display: block;
  width: 100%; height: auto;
  aspect-ratio: 240 / 135;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 2px;
  background: #000;
}
.device-label {
  text-align: center; margin-top: 10px;
  font-size: 10px; color: rgba(255,255,255,0.4);
  letter-spacing: 3px; text-transform: uppercase;
}
.buttons-col {
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
}
.sim-btn {
  width: 52px; height: 52px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  font-size: 16px; font-weight: 700; font-family: inherit;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.05s, box-shadow 0.05s;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.sim-btn:active {
  transform: scale(0.92);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
}
.btn-a {
  background: linear-gradient(145deg, #ffd23f, #e6b800);
  color: #1a1500; border-color: #b89a00;
}
.btn-b {
  background: linear-gradient(145deg, #e8e6e3, #c8c6c3);
  color: #333; border-color: #a0a0a0;
}
.controls-hint {
  text-align: center; margin-top: 16px;
  font-size: 11px; color: var(--dim);
}
.controls-hint kbd {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 3px; padding: 2px 6px; font-size: 10px;
}
.loading-overlay {
  position: absolute; inset: 0;
  background: rgba(16,16,20,0.9);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: 18px; z-index: 10;
  transition: opacity 0.5s;
}
.loading-overlay.done { opacity: 0; pointer-events: none; }
.loading-text {
  font-size: 14px; color: var(--accent); letter-spacing: 2px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
@media (max-width: 560px) {
  .device-frame { padding: 12px 14px 16px; }
  .device-body { gap: 12px; }
  .sim-btn { width: 44px; height: 44px; font-size: 14px; }
  .buttons-col { gap: 14px; }
}
@media (max-width: 380px) {
  .device-body { gap: 10px; }
  .sim-btn { width: 38px; height: 38px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="device-frame">
  <div class="loading-overlay" id="loading">
    <div class="loading-text">LOADING...</div>
  </div>
  <div class="device-body">
    <div class="screen-bezel">
      <canvas id="stickmon-canvas" width="240" height="135"></canvas>
    </div>
    <div class="buttons-col">
      <button class="sim-btn btn-a" id="btn-a" title="A - 确认/互动">A</button>
      <button class="sim-btn btn-b" id="btn-b" title="B - 取消/返回">B</button>
    </div>
  </div>
  <div class="device-label">M5StickS3</div>
  <div class="controls-hint">
    <kbd>Z</kbd> / <kbd>Enter</kbd> = A &nbsp;
    <kbd>X</kbd> / <kbd>Esc</kbd> = B
  </div>
</div>

<script>
// ── Button / keyboard input ──────────────────────────────────────────
function bindButton(el, btnIdx) {
  const down = (e) => { e.preventDefault(); Module._stickmon_button_down(btnIdx); };
  const up   = (e) => { e.preventDefault(); Module._stickmon_button_up(btnIdx); };
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter') {
    Module._stickmon_button_down(0);
  } else if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') {
    Module._stickmon_button_down(1);
  }
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter') {
    Module._stickmon_button_up(0);
  } else if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') {
    Module._stickmon_button_up(1);
  }
});

// ── Emscripten Module config ─────────────────────────────────────────
var Module = {
  canvas: document.getElementById('stickmon-canvas'),
  // 带版本查询串加载 wasm/data，跳出旧 1h 强缓存条目
  locateFile: function(path) { return path + '?v=2'; },
  onRuntimeInitialized: function() {
    document.getElementById('loading').classList.add('done');
    bindButton(document.getElementById('btn-a'), 0);
    bindButton(document.getElementById('btn-b'), 1);
    console.log('[StickMon Web] Runtime initialized');
  },
  print: function(text) { console.log('[StickMon]', text); },
  printErr: function(text) { console.warn('[StickMon]', text); },
};
</script>
<script src="stickmon.js?v=2"></script>

</body>
</html>
