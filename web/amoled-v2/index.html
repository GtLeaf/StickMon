<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StickMon · 微雪 V2 试玩</title>
<style>
:root{color-scheme:dark;background:#101014;color:#e8e6df;font:14px/1.6 'SF Mono',Menlo,Consolas,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}body{margin:0;padding:14px 12px 18px}main{max-width:680px;margin:auto}
.heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}.heading strong{color:#ffd23f;letter-spacing:1px}.heading span{color:#9a97a8;font-size:12px}
.stage{display:flex;justify-content:center;align-items:center}.device{width:392px;max-width:100%;flex-shrink:0;border:1px solid #33333f;border-radius:24px;padding:12px;background:#1a1a22}
canvas{display:block;width:100%;height:auto;aspect-ratio:368/448;border-radius:14px;background:#050507;touch-action:none;image-rendering:pixelated;user-select:none;-webkit-user-select:none}
.label{font-size:10px;color:#9a97a8;letter-spacing:2px;text-align:center;margin-top:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{font:inherit;color:#e8e6df;background:#1a1a22;border:1px solid #33333f;padding:7px 12px;border-radius:7px;cursor:pointer;min-height:40px}button:hover{border-color:#ffd23f}button:focus-visible,canvas:focus-visible{outline:2px solid #ffd23f;outline-offset:3px}button:disabled{opacity:.45;cursor:default}#retry{color:#ffd23f}
#status{margin:10px 0 0;min-height:23px;font-size:12px;color:#9a97a8}#status.error{color:#ffae91}
@media(max-width:580px){.stage{display:block}.device{margin:auto;width:368px;padding:9px;border-radius:20px}.heading span{font-size:10px}.tools{margin-top:10px}body{padding:10px 8px 14px}}
</style>
<main>
  <div class="heading"><strong>StickMon</strong><span>微雪 AMOLED 1.8 V2</span></div>
  <div class="stage">
    <div class="device"><canvas id="stickmon-canvas" width="368" height="448" tabindex="0" aria-label="微雪游戏屏幕，支持点击、长按和拖动"></canvas><div class="label">WAVESHARE · AMOLED V2</div></div>
  </div>
  <div class="tools"><button id="mute" disabled aria-pressed="false">静音</button><button id="restart" disabled>重启</button><button id="reset" disabled>清空存档</button><button id="resume" hidden>继续试玩</button><button id="retry" hidden>重新加载</button></div>
  <p id="status" role="status" aria-live="polite">正在准备微雪试玩…</p>
</main>
<script>
'use strict';
var SIM_ASSETS = {};
const STORAGE_PREFIX = 'stickmon_sim:stickmon:waveshare-amoled-1-8-v2:';
const canvas = document.getElementById('stickmon-canvas');
const statusLine = document.getElementById('status');
let ready = false, stopped = false, resetting = false, storageFailed = false, saveBlocked = false;
let paused = document.hidden, manuallyPaused = false, logicalTime = 0, lastFrame = null, animation = 0, saveTimer = 0;
let pointerId = null, lastPoint = {x:0,y:0}, releaseLock = null;
function notify(type, extra = {}) {
  if (parent !== window) parent.postMessage({source:'stickmon-simulator',type,...extra}, location.origin);
}
function status(text, error = false) {
  statusLine.textContent = text;
  statusLine.classList.toggle('error', error);
}
function failure(text) {
  status(text, true);
  document.getElementById('retry').hidden = false;
  notify('load_failed');
}
function save() {
  if (!ready || resetting) return false;
  const ok = Module._stickmon_web_save() === 1;
  if (!ok || storageFailed) status(saveBlocked ? '存档损坏或版本过新，已保留原档。清空存档后可重新开始。' : '保存失败，请检查浏览器是否允许本地存储。', true);
  else status('进度已保存在当前浏览器');
  return ok && !storageFailed;
}
function resumeAudio() {
  const audio = window._stickmonAudio;
  if (audio && !paused && audio.context.state === 'suspended') audio.context.resume().catch(() => status('声音尚未启用，可再次点击屏幕开启。'));
}
function releasePointer(cancelled = true) {
  if (pointerId === null) return;
  const id = pointerId;
  pointerId = null;
  if (ready && !stopped) Module._stickmon_web_touch(cancelled ? 3 : 2, lastPoint.x, lastPoint.y);
  if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
}
function setPaused(value) {
  releasePointer();
  paused = value || manuallyPaused;
  lastFrame = null;
  if (ready && paused) {
    save();
    Module._stickmon_web_pause();
    const audio = window._stickmonAudio;
    if (audio && audio.context.state === 'running') audio.context.suspend().catch(() => {});
  } else if (!paused && ready) {
    Module._stickmon_web_resume();
    resumeAudio();
  }
}
function frame(now) {
  if (stopped) return;
  if (!paused && ready) {
    if (lastFrame !== null) logicalTime += now - lastFrame;
    lastFrame = now;
    Module._stickmon_web_tick(Math.floor(logicalTime) >>> 0);
  }
  animation = requestAnimationFrame(frame);
}
var Module = {
  canvas,
  locateFile: function(path) { return SIM_ASSETS[path] || path; },
  onStorageError() {storageFailed = true; status('浏览器存储不可用，当前进度无法保存。', true);},
  onScreenLock() {
    manuallyPaused = true;
    setPaused(true);
    document.getElementById('resume').hidden = false;
    if (!storageFailed && !saveBlocked) status('试玩已暂停，点击“继续试玩”恢复。');
  },
  onRestart() {resetting = true; location.reload();},
  onAbort() {failure('游戏加载失败，请重新加载。');},
  printErr(text) {console.error(text);},
  onGameReady(loaded, blocked) {
    ready = true;
    saveBlocked = Boolean(blocked);
    for (const id of ['mute','restart','reset']) document.getElementById(id).disabled = false;
    if (saveBlocked) status('存档损坏或版本过新，已保留原档。清空存档后可重新开始。', true);
    else if (!storageFailed) status(loaded ? '已恢复上次进度，点击屏幕继续' : '已准备好，点击屏幕开始');
    notify('ready', {simulatorVersion:'amoled-v2-web-1',lifecycleVersion:1});
    animation = requestAnimationFrame(frame);
    saveTimer = setInterval(() => {if (!paused) save();}, 15000);
  }
};
function point(event) {
  const rect = canvas.getBoundingClientRect();
  return {x:Math.max(0,Math.min(367,Math.floor((event.clientX-rect.left)*368/rect.width))),
          y:Math.max(0,Math.min(447,Math.floor((event.clientY-rect.top)*448/rect.height)))};
}
canvas.addEventListener('pointerdown', event => {
  if (!ready || stopped || pointerId !== null || (event.pointerType === 'mouse' && event.button !== 0)) return;
  event.preventDefault();
  if (manuallyPaused) {
    document.getElementById('resume').click();
    return;
  }
  paused = false;
  canvas.focus({preventScroll:true});
  resumeAudio();
  pointerId = event.pointerId;
  lastPoint = point(event);
  canvas.setPointerCapture(pointerId);
  Module._stickmon_web_touch(0,lastPoint.x,lastPoint.y);
  notify('input',{inputType:'touch'});
});
canvas.addEventListener('pointermove', event => {
  if (event.pointerId !== pointerId) return;
  event.preventDefault();
  lastPoint = point(event);
  Module._stickmon_web_touch(1,lastPoint.x,lastPoint.y);
});
canvas.addEventListener('pointerup', event => {
  if (event.pointerId !== pointerId) return;
  lastPoint = point(event);
  releasePointer(false);
});
for (const type of ['pointercancel','lostpointercapture']) canvas.addEventListener(type, event => {if(event.pointerId === pointerId) releasePointer();});
document.addEventListener('visibilitychange', () => setPaused(document.hidden));
window.addEventListener('blur', () => setPaused(true));
window.addEventListener('focus', () => {if(!document.hidden && !stopped) setPaused(false);});
window.addEventListener('pagehide', () => {
  releasePointer();
  if (!resetting && !stopped) save();
  stopped = true;
  clearInterval(saveTimer); cancelAnimationFrame(animation);
  if (ready) Module._stickmon_web_pause();
  if (releaseLock) releaseLock();
});
window.addEventListener('message', event => {
  if (parent === window || event.source !== parent || event.origin !== location.origin) return;
  const data = event.data;
  if (!data || data.source !== 'stickmon-host') return;
  if (data.type === 'close') {
    releasePointer();
    const saved = save();
    stopped = true;
    clearInterval(saveTimer); cancelAnimationFrame(animation);
    if (ready) Module._stickmon_web_pause();
    if (releaseLock) releaseLock();
    notify('closed',{requestId:data.requestId,saved});
  } else if (data.type === 'pause') setPaused(true);
  else if (data.type === 'resume' && !document.hidden && !stopped) setPaused(false);
});
document.getElementById('mute').onclick = event => {
  const audio = window._stickmonAudio;
  if (!audio) return;
  audio.muted = !audio.muted;
  audio.masterGain.gain.value = audio.muted ? 0 : audio.volumePercent / 100;
  event.target.textContent = audio.muted ? '开启声音' : '静音';
  event.target.setAttribute('aria-pressed',String(audio.muted));
  resumeAudio();
};
document.getElementById('restart').onclick = () => {if(save()) location.reload();};
document.getElementById('reset').onclick = () => {
  if (!confirm('清空当前浏览器中的微雪试玩进度？此操作无法撤销，不影响 Stick 和实体设备。')) return;
  try {
    const keys = [];
    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key && key.startsWith(STORAGE_PREFIX)) keys.push(key);}
    for(const key of keys) localStorage.removeItem(key);
    resetting = true;
    location.reload();
  } catch(e) {status('无法清空存档，请检查浏览器存储权限。',true);}
};
document.getElementById('retry').onclick = () => location.reload();
document.getElementById('resume').onclick = () => {
  manuallyPaused = false;
  document.getElementById('resume').hidden = true;
  setPaused(document.hidden);
  if (!storageFailed && !saveBlocked) status('试玩已继续');
};
function resize() {notify('resize',{height:Math.ceil(document.documentElement.getBoundingClientRect().height)});}
new ResizeObserver(resize).observe(document.querySelector('main'));
window.addEventListener('load',resize);
async function load() {
  const script = document.createElement('script');
  script.src = document.getElementById('wasm-source').dataset.src;
  script.onerror = () => failure('试玩文件下载失败，请重新加载。');
  document.body.appendChild(script);
}
if (navigator.locks) {
  navigator.locks.request(STORAGE_PREFIX,{ifAvailable:true},async lock => {
    if (!lock) {failure('微雪试玩已在其他页面运行。请关闭其他页面后重新加载。');return;}
    // Hold ownership for the complete instance lifetime, including loading.
    await new Promise(resolve => {releaseLock=resolve;load();});
  }).catch(() => failure('无法启动试玩，请使用支持本地存储的浏览器。'));
} else failure('当前浏览器无法保护试玩存档，请使用新版浏览器并通过 HTTPS 打开。');
</script>
<!-- Kept inert until this instance owns the save lock; hash script rewrites data-src. -->
<script id="wasm-source" type="application/x-stickmon" data-src="stickmon.js"></script>
</html>
