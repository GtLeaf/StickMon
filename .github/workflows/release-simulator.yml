# Both simulators are built from the same checked-out source commit.
name: 发布网页模拟器

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simulator-release
  cancel-in-progress: false

env:
  EMSDK_VERSION: 4.0.15

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install pinned emsdk
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build both targets
        run: |
          source emsdk/emsdk_env.sh
          bash tools/build_web.sh --target sticks3
          bash tools/build_web.sh --target amoled-v2

      - name: Checkout flasher
        uses: actions/checkout@v4
        with:
          repository: GtLeaf/stickmon-flasher
          token: ${{ secrets.FLASHER_PUSH_TOKEN }}
          path: flasher

      - name: Node runtime for bundle validation
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and publish bundles
        run: |
          python3 tools/publish_web.py --flasher flasher --skip-build
          cd flasher
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sim
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish StickS3 and AMOLED V2 simulators"
            git push
          fi
